<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Calculator</title>
  <style>
    body {
      background-color: #f8e9dc;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .container {
      display: inline-block;
      text-align: left;
      margin-top: 50px;
      padding: 20px;
      border: 1px solid #ccc;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>Python Calculator</h1>
  <form action="{% url 'calculate' %}" method="post">
      {% csrf_token %}
      <label for="inputX">Enter X: </label>
      <input type="number" id="inputX" name="x" required/>
      <br><br>
      <label for="inputY">Enter Y: </label>
      <input type="number" id="inputY" name="y" required/>
      <br><br>
      <label for="inputZ">Enter Z: </label>
      <input type="number" id="inputZ" name="z" required/>
      <br><br>
      <input type="submit" value="Calculate">
  </form>
</body>
</html>
